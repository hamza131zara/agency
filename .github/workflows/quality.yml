name: Phase I release checks
on:
  push:
    branches: [main, "feat/**", "qa/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          coverage: none
      - name: Validate HTML, local links and required files
        run: python scripts/validate_site.py
      - name: Validate portfolio evidence and visual permissions
        run: python scripts/validate_portfolio_evidence.py
      - name: Validate Phase 4 portfolio acceptance structure
        run: python scripts/validate_portfolio_acceptance.py
      - name: Validate product release and commercial approvals
        run: python scripts/validate_product_release_governance.py
      - name: Audit production launch blockers (report-only)
        run: python scripts/validate_launch_readiness.py
      - name: Validate SEO and discoverability fundamentals
        run: python scripts/validate_discoverability.py
      - name: Test launch-readiness release gate
        run: |
          python tests/test_launch_readiness.py
          python tests/test_discoverability.py
      - name: Check JavaScript syntax
        run: node --check assets/js/main.js
      - name: Check PHP syntax
        run: |
          php -l contact.php
          php -l config.example.php
      - name: Smoke-test contact endpoint without real email
        run: python tests/test_contact_endpoint.py
      - name: Compile Python test helpers
        run: python -m py_compile scripts/validate_site.py scripts/validate_portfolio_evidence.py scripts/validate_portfolio_acceptance.py scripts/validate_product_release_governance.py scripts/validate_launch_readiness.py tests/test_contact_endpoint.py tests/test_launch_readiness.py

  browser-and-accessibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          coverage: none
      - name: Install browser-test dependencies
        run: npm install --no-audit --no-fund
      - name: Install Chromium and OS dependencies
        run: npx playwright install --with-deps chromium
      - name: Run browser, responsive and WCAG accessibility checks
        run: npm run test:e2e
      - name: Upload screenshots, traces and reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: phase-one-browser-review
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 14

  automation-sandbox:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: agency_automation
          POSTGRES_PASSWORD: local-ci-password
          POSTGRES_DB: agency_automation
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agency_automation -d agency_automation"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://agency_automation:local-ci-password@127.0.0.1:5432/agency_automation
      TEST_DATABASE_URL: postgres://agency_automation:local-ci-password@127.0.0.1:5432/agency_automation
      AUTOMATION_HMAC_KEYS: '{"ci-test":"test-only-secret-material-that-is-at-least-32-bytes"}'
      DATABASE_SSL: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: "22.23.4"
      - name: Install pinned project dependencies
        run: npm install --no-audit --no-fund
      - name: Apply automation database schema
        run: npm run automation:migrate
      - name: Check operator dashboard JavaScript syntax
        run: |
          node --check automation-runtime/public/operator.js
          node --check automation-runtime/scripts/create-operator-password-hash.mjs
      - name: Run lead-intake PostgreSQL integration suite
        run: npm run test:automation
