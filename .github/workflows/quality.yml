name: Site quality checks
on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate-static-site:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Validate required site files
        shell: bash
        run: |
          set -euo pipefail
          test -s index.html
          test -s assets/css/styles.css
          test -s assets/js/main.js
          test -s assets/favicon.svg
          grep -q '<html lang="en">' index.html
          grep -q 'id="main"' index.html
          grep -q 'id="inquiry-form"' index.html
          grep -q 'PHASE 2' index.html
          node --check assets/js/main.js
          if grep -R -n -E 'sk_live_[A-Za-z0-9]+|service_role.{0,20}eyJ' . --exclude-dir=.git; then
            echo 'Possible secret-like value found; inspect before continuing.'
            exit 1
          fi
