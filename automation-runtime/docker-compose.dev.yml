services:
  postgres:
    image: postgres:16
    container_name: agency-automation-postgres
    environment:
      POSTGRES_USER: agency_automation
      POSTGRES_PASSWORD: local-dev-only
      POSTGRES_DB: agency_automation
    ports:
      - "5432:5432"
    volumes:
      - agency-automation-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agency_automation -d agency_automation"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  agency-automation-postgres:
